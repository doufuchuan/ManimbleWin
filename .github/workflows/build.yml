name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (dotnet build)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ManimbleWin.sln

      - name: Build
        run: dotnet build ManimbleWin.sln -c Release --no-restore --nologo

  release:
    name: Publish exe + installer
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ManimbleWin.sln

      - name: Publish self-contained win-x64 exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/ManimbleWin/ManimbleWin.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --nologo `
            -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/ManimbleWin.exe')) {
            throw 'dist/ManimbleWin.exe was not produced.'
          }
          Get-Item 'dist/ManimbleWin.exe' | ForEach-Object {
            Write-Host "Executable: $($_.FullName) ($($_.Length) bytes)"
          }

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }

          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup not found; installing via Chocolatey...'
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'Unable to locate or install ISCC.exe (Inno Setup 6).'
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:ISCC_PATH installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'Output/ManimbleWin-setup.exe')) {
            throw 'Output/ManimbleWin-setup.exe was not produced.'
          }
          Get-Item 'Output/ManimbleWin-setup.exe' | ForEach-Object {
            Write-Host "Installer: $($_.FullName) ($($_.Length) bytes)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ManimbleWin-${{ github.ref_name }}
          path: |
            dist/ManimbleWin.exe
            Output/ManimbleWin-setup.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ManimbleWin.exe
            Output/ManimbleWin-setup.exe
          generate_release_notes: true
